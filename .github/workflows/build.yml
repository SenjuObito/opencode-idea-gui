name: Build Plugin

# Releases are cut from version tags only, e.g. v1.0.0-opencode.1.
# Branch pushes do NOT build here — use the Tests workflow / a local
# `./gradlew buildPlugin` for that. Re-running a failed release is done from the
# Actions UI ("Re-run jobs"), not by pushing another commit.
on:
  push:
    tags:
      - 'v*'
  # Manual run for debugging the build itself (it never publishes a release —
  # the release job is gated on a tag ref).
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install webview dependencies
        working-directory: webview
        run: npm ci

      - name: Install ai-bridge dependencies
        working-directory: ai-bridge
        run: npm ci

      # The tag is the release version, so it must equal build.gradle's version —
      # otherwise the shipped jar (and the plugin zip name) would carry a stale
      # version while the GitHub release claims a newer one. Fail loudly instead.
      - name: Verify tag matches plugin version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION=$(grep -E "^version[[:space:]]*=" build.gradle | head -n 1 | sed -E "s/^version[[:space:]]*=[[:space:]]*'([^']+)'.*/\1/")
          echo "tag=$TAG build.gradle version=$VERSION"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read version from build.gradle"
            exit 1
          fi
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match build.gradle version $VERSION — bump the version (or fix the tag) and re-tag."
            exit 1
          fi

      - name: Build Plugin
        run: ./gradlew buildPlugin

      - name: Locate plugin zip
        id: extract
        run: |
          ZIP_FILE=$(ls build/distributions/*.zip | head -n 1)
          echo "zip-file=$ZIP_FILE" >> $GITHUB_OUTPUT
          echo "zip-name=$(basename "$ZIP_FILE")" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.extract.outputs.zip-file }}
          # `archive: false` uploads the plugin zip as-is (no zip-inside-a-zip).
          # The artifact is then named after the file itself, which is why the
          # release job downloads it by pattern instead of by name.
          archive: false
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    # Belt and braces: only a tag push may publish a release, whatever triggers
    # this workflow in the future.
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          # The uploaded artifact is already the final zip.
          skip-decompress: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          generate_release_notes: true
