name: Build Plugin

# Releases are cut from version tags only, e.g. v0.0.1. The tag is the version:
# it is handed to Gradle as -PreleaseVersion, so no build.gradle edit is needed.
# Branch pushes do NOT build here — use the Tests workflow / a local
# `./gradlew buildPlugin` for that. Re-running a failed release is done from the
# Actions UI ("Re-run jobs"), not by pushing another commit.
on:
  push:
    tags:
      - 'v*'
  # Manual run for debugging the build itself (it never publishes a release —
  # the release job is gated on a tag ref).
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install webview dependencies
        working-directory: webview
        run: npm ci

      - name: Install ai-bridge dependencies
        working-directory: ai-bridge
        run: npm ci

      # The tag is the release version. Strip the leading `v` and hand the rest
      # to Gradle, which names the plugin zip after it and forwards it to the
      # webview build (as RELEASE_VERSION) so the version shown in the UI tracks
      # the same tag. Nothing has to be edited in build.gradle to cut a release.
      - name: Resolve release version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [ -z "$VERSION" ] || [ "$VERSION" = "${GITHUB_REF_NAME}" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} is not of the form v<version>."
              exit 1
            fi
            echo "Releasing tag ${GITHUB_REF_NAME} as version $VERSION"
          else
            # Manual workflow_dispatch run: no tag to take a version from, so
            # build with whatever build.gradle carries.
            VERSION=""
            echo "Not a tag ref (${GITHUB_REF_TYPE}) — using build.gradle's version"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Plugin
        env:
          # Passed via env rather than interpolated into the script, so a tag
          # can never inject shell syntax into the run block.
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          if [ -n "$RELEASE_VERSION" ]; then
            ./gradlew buildPlugin "-PreleaseVersion=$RELEASE_VERSION"
          else
            ./gradlew buildPlugin
          fi

      - name: Locate plugin zip
        id: extract
        run: |
          ZIP_FILE=$(ls build/distributions/*.zip | head -n 1)
          echo "zip-file=$ZIP_FILE" >> $GITHUB_OUTPUT
          echo "zip-name=$(basename "$ZIP_FILE")" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.extract.outputs.zip-file }}
          # `archive: false` uploads the plugin zip as-is (no zip-inside-a-zip).
          # upload-artifact then names the artifact after the file itself, so the
          # release job downloads all artifacts of the run rather than guessing
          # that name.
          archive: false
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    # Belt and braces: only a tag push may publish a release, whatever triggers
    # this workflow in the future.
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history and tags so the git-log fallback in
          # tools/extract-release-notes.mjs can diff against the previous tag.
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          # The uploaded artifact is already the final zip.
          skip-decompress: true

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'

      # Release notes come from CHANGELOG.md (Chinese half, then the English half
      # under an `### English` heading), not from auto-generated commit lists —
      # commits here are Chinese-only, so the release page had no English.
      - name: Build release notes
        run: node tools/extract-release-notes.mjs "${GITHUB_REF_NAME}" release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          body_path: release-notes.md
