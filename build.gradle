plugins {
    id 'java'
    id 'checkstyle'
    id 'org.jetbrains.intellij.platform' version '2.10.5'
}

// Load local properties file (not committed to git)
def localPropertiesFile = rootProject.file('local.properties')
def localProperties = new Properties()
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
    println "Loaded local.properties"
}

// Print Java version info
println "Java version: ${System.getProperty('java.version')}"
println "Java home: ${System.getProperty('java.home')}"

// Helper method: prioritize local.properties, fallback to gradle.properties
ext.getLocalProperty = { String key, String defaultValue = null ->
    return localProperties.getProperty(key) ?: project.findProperty(key) ?: defaultValue
}

// Get custom JDK path from local properties (support both property names)
def localJavaHome = getLocalProperty('java.home') ?: getLocalProperty('org.gradle.java.home')

checkstyle {
    toolVersion = '10.12.5'
    configFile = file('checkstyle.xml')
    // Quality gate covers production sources only. Test code legitimately breaks
    // these rules: fixture child-process mains must write to System.out so the
    // parent can capture stdout, and single-element-array lambda captures are a
    // common, harmless test idiom.
    sourceSets = [project.sourceSets.main]
}

// sourceSets above unhooks checkstyleTest from the check lifecycle; disabling the
// task as well makes an explicit `gradlew checkstyleTest` a SKIPPED no-op instead
// of a failure.
tasks.named('checkstyleTest') {
    enabled = false
}

group = 'com.senjuobito.opencode-buddy'
// The release tag is the source of truth: the Build Plugin workflow strips the
// leading `v` off the tag and passes it as -PreleaseVersion, so the plugin zip
// name and the webview's bundled APP_VERSION always match the tag that
// triggered the build. The literal below is only the fallback for local builds
// (`./gradlew buildPlugin`) and for manual workflow_dispatch runs, which have
// no tag. Add the released version as the CHANGELOG.md top heading too — the
// release notes are looked up there by version, and fall back to the git log
// when the heading is missing.
version = findProperty('releaseVersion') ?: '0.0.1'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17

    // Use Java Toolchain for consistent JDK across all tasks
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Configure custom JDK path if specified in local.properties
if (localJavaHome) {
    def javaHomeDir = file(localJavaHome)
    if (javaHomeDir.exists()) {
        println "Using custom Java home: ${localJavaHome}"

        // Set the Java launcher for all JavaExec and Test tasks (except runIde)
        tasks.withType(JavaCompile).configureEach {
            options.fork = true
            options.forkOptions.javaHome = javaHomeDir
        }

        tasks.withType(JavaExec).configureEach {
            // Skip runIde task to use JBR for JCEF support
            if (it.name != 'runIde') {
                javaLauncher = javaToolchains.launcherFor {
                    languageVersion = JavaLanguageVersion.of(21)
                }
            }
        }
    } else {
        println "WARNING: Configured java.home does not exist: ${localJavaHome}"
    }
}

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.tomlj:tomlj:1.1.1'
    implementation 'javazoom:jlayer:1.0.1'
    implementation 'org.snakeyaml:snakeyaml-engine:3.0.1'
    implementation 'com.twelvemonkeys.imageio:imageio-webp:3.12.0'
    // OpenCode 1.x stores sessions in ~/.local/share/opencode/opencode.db
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'
    testImplementation 'junit:junit:4.13.2'

    intellijPlatform {
        def targetIde = project.findProperty('targetIde') ?: 'IC'
        if (targetIde == 'PC') {
            pycharmCommunity('2024.3')
            bundledPlugin('PythonCore')
        } else if (targetIde == 'PY') {
            pycharmProfessional('2024.3')
            bundledPlugin('Pythonid')
        } else if (targetIde == 'RD') {
            // Rider 2025.3.2
            rider('2025.3.2')
            // Enable Terminal Plugin support
            bundledPlugin('org.jetbrains.plugins.terminal')
        } else {
            intellijIdeaCommunity('2024.3.1')
            bundledPlugin('com.intellij.java')
            // Add Python plugin to support compiling PythonContextCollector
            plugin('PythonCore', '243.22562.145')
            // Enable Terminal Plugin support
            bundledPlugin('org.jetbrains.plugins.terminal')
        }

        // Git4Idea is bundled in all JetBrains IDEs that support Git
        // (IC/PC/PY/RD). Required so we can run a real `git diff` via
        // git4idea.commands.* for the Commit AI feature.
        bundledPlugin('Git4Idea')

        instrumentationTools()

        // IDEs to verify the plugin against (used by `verifyPlugin` task).
        // Mirrors what JetBrains Marketplace runs so we can catch binary
        // incompatibility (e.g. new abstract methods in JCEF) before upload.
        pluginVerifier()
    }
}

intellijPlatform {
    pluginVerification {
        // Keep local verification focused on binary/internal API compatibility
        // issues that match Marketplace rejection criteria.
        failureLevel = [
            org.jetbrains.intellij.platform.gradle.tasks.VerifyPluginTask.FailureLevel.COMPATIBILITY_PROBLEMS,
            org.jetbrains.intellij.platform.gradle.tasks.VerifyPluginTask.FailureLevel.INTERNAL_API_USAGES
        ]

        // PythonCore is pinned to 243.x for compileOnly use across the
        // sinceBuild=233 .. untilBuild=263.* range. Verifier on 262.x EAP
        // cannot resolve com.jetbrains.python classes from a 243.x PythonCore,
        // so we mark the package as external — references from the optional
        // python-features.xml content module are guarded by the optional
        // dependency on com.intellij.modules.python at runtime.
        externalPrefixes = ['com.jetbrains.python']

        ides {
            // 2026.2.1 EAP build 262.9437.22 – the exact build that surfaced
            // the CefResourceHandler / PluginManagerCore issues during
            // marketplace verification.
            ide('IU', '262.9437.22')
        }
    }
}

sourceSets {
    main {
        java {
            def targetIde = project.findProperty('targetIde') ?: 'IC'
            // PyCharm: exclude Java context collector
            if (targetIde == 'PC' || targetIde == 'PY') {
                exclude '**/JavaContextCollector.java'
                exclude '**/JavaClassNavigationSupport.java'
            }
            // Rider: exclude both Java and Python context collectors (no PSI support)
            if (targetIde == 'RD') {
                exclude '**/JavaContextCollector.java'
                exclude '**/JavaClassNavigationSupport.java'
                exclude '**/PythonContextCollector.java'
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Ensure consistent source/target compatibility
    options.release.set(17)
}

// Ensure plugin.xml is patched with the correct since/until build and change notes
patchPluginXml {
    // plugin compatibility range
    sinceBuild = '233'
    untilBuild = '263.*'

    // Release notes shown in plugin repositories
    // Dynamically load the latest changelog entry from CHANGELOG.md and convert to simple HTML.
    // Two heading styles mark a version section, so either can be the newest one:
    //   ## 1.0.0-opencode.1 (2026-09-06)     <- current format
    //   ##### **2026年8月26日（v0.5.4）**     <- legacy format
    def changelogFile = file('CHANGELOG.md')
    def computedChangeNotes = ''
    if (changelogFile.exists()) {
        def lines = changelogFile.readLines('UTF-8')
        // '### Subsection' and '#### …' must NOT end the section: only '## ' and '#####' open one.
        def isSectionHeader = { String t -> t.startsWith('#####') || t.startsWith('## ') }
        def start = lines.findIndexOf { isSectionHeader(it.trim()) }

        if (start >= 0) {
            def sb = new StringBuilder()
            boolean inList = false
            int i = start + 1
            while (i < lines.size() && !isSectionHeader(lines[i].trim())) {
                def line = lines[i]
                def t = line.trim()

                if (t.startsWith('- ')) {
                    if (!inList) { sb.append('<ul>'); inList = true }
                    def item = t.substring(2)
                    // remove checkbox markers like [x] or [ ]
                    if (item.startsWith('[') && item.length() > 3 && item.charAt(2) == ']') {
                        item = item.substring(3).trim()
                    }
                    item = item.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;')
                    sb.append('<li>' + item + '</li>')
                } else if (t.startsWith('![') || t.startsWith('<img')) {
                    // skip images
                } else if (t.length() == 0) {
                    if (inList) { sb.append('</ul>'); inList = false }
                    sb.append('<br/>')
                } else {
                    if (inList) { sb.append('</ul>'); inList = false }
                    // markdown heading -> bold paragraph, plain line -> paragraph
                    def isHeading = t.startsWith('#')
                    def para = isHeading ? t.replaceAll(/^#+\s*/, '') : t
                    para = para.replace('**', '')
                    para = para.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;')
                    sb.append(isHeading ? '<p><b>' + para + '</b></p>' : '<p>' + para + '</p>')
                }

                i++
            }
            if (inList) { sb.append('</ul>') }
            computedChangeNotes = sb.toString()
        }
    }

    changeNotes = computedChangeNotes ?: '<p>No changelog found.</p>'
}

// macOS: Finder may recreate .DS_Store inside build/ while Gradle's Delete task is
// removing it, which fails with "New files were found". Bypass Gradle's strict
// directory-delete check and remove build/ with a tolerant strategy instead.
tasks.named('clean', Delete) {
    // Clear targets registered by the Java plugin so the strict Delete action is a no-op.
    delete = []
    doLast {
        def buildDir = layout.buildDirectory.get().asFile
        if (!buildDir.exists()) {
            return
        }
        // Prefer shell rm on macOS — more resilient to concurrent .DS_Store writes.
        def isMac = System.getProperty('os.name', '').toLowerCase().contains('mac')
        if (isMac) {
            providers.exec {
                commandLine 'rm', '-rf', buildDir.absolutePath
            }.result.get()
        } else {
            ant.delete(dir: buildDir, failonerror: false)
        }
        if (buildDir.exists()) {
            // One more attempt after stripping junk metadata files
            buildDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                if (f.name == '.DS_Store' || f.name == 'Thumbs.db') {
                    f.delete()
                }
            }
            ant.delete(dir: buildDir, failonerror: false)
        }
        if (buildDir.exists()) {
            throw new GradleException("Unable to delete build directory: ${buildDir}")
        }
    }
}

// Disable product-specific searchable options/instrument tasks if present
// Use matching to cover task name variants like buildSearchableOptionsIC / buildSearchableOptionsIU etc.
tasks.matching { it.name.startsWith('buildSearchableOptions') }.configureEach {
    enabled = false
}

tasks.named('buildSearchableOptions') {
    enabled = false
}

tasks.matching { it.name == 'instrumentCode' || it.name == 'instrumentTestCode' }.configureEach {
    actions.clear()
    doLast {
        def target = name == 'instrumentCode' ? 'instrumentCode' : 'instrumentTestCode'
        def source = name == 'instrumentCode' ? sourceSets.main.output.classesDirs : sourceSets.test.output.classesDirs
        copy {
            from source
            into layout.buildDirectory.dir("instrumented/${target}")
        }
    }
}

tasks.named('jarSearchableOptions') {
    enabled = false
}

tasks.named('runIde') {
    jvmArgumentProviders.add({
        [
            '-Djcef.sandbox.enable=false',
            // Disable automatic plugin unloading (prevents unloading when file changes are detected)
            '-Didea.auto.reload.plugins=false',
            // Disable dynamic plugin unloading
            '-Didea.dynamic.plugins.allowed=false',
            // Enable internal mode
            '-Didea.is.internal=true',
            // Disable file system event monitoring (optional)
            // '-Didea.filewatcher.disabled=true',
            // Increase plugin loading timeout
            '-Didea.plugins.load.timeout=60000'
        ]
    } as CommandLineArgumentProvider)

    // Set system properties
    systemProperty 'idea.auto.reload.plugins', 'false'
    systemProperty 'idea.dynamic.plugins.allowed', 'false'
    systemProperty 'idea.is.internal', 'true'
    systemProperty 'idea.plugin.in.sandbox.mode', 'true'

    // Configure log output to console
    systemProperty 'idea.log.debug.categories', '#com.opencodebuddy'

    // Point bridge resolver to sibling opencode-buddy-core source directory for instant local debugging
    File siblingCoreSourceDir = new File(projectDir.parentFile, 'opencode-buddy-core')
    if (siblingCoreSourceDir.exists() && new File(siblingCoreSourceDir, 'channel-manager.js').exists()) {
        systemProperty 'opencode.bridge.path', siblingCoreSourceDir.absolutePath
        environment 'OPENCODE_DEV_BRIDGE_PATH', siblingCoreSourceDir.absolutePath
        println "runIde: Pointed opencode.bridge.path to local source: ${siblingCoreSourceDir.absolutePath}"
    } else {
        def stableBridge = layout.buildDirectory.dir("stable-ai-bridge").get().asFile
        if (stableBridge.exists()) {
            systemProperty 'opencode.bridge.path', stableBridge.absolutePath
        }
    }

    // Redirect standard output
    standardOutput = System.out
    errorOutput = System.err

    // Copy custom configuration to sandbox
    doFirst {
        def sandboxConfig = file('sandbox-idea.properties')
        if (sandboxConfig.exists()) {
            def sandboxDir = layout.buildDirectory.dir("idea-sandbox").get().asFile
            def configDir = new File(sandboxDir, 'config')
            configDir.mkdirs()

            copy {
                from sandboxConfig
                into configDir
                rename { 'idea.properties' }
            }
            println "Copied sandbox config to: ${configDir}/idea.properties"
        }
    }
}

// OpenCode Buddy Core package directories
def aiBridgePackDir = layout.buildDirectory.dir('ai-bridge-pack').get().asFile
def aiBridgeArchive = new File(aiBridgePackDir, 'ai-bridge.zip')
def aiBridgeHashFile = new File(aiBridgePackDir, 'ai-bridge.hash')

// Build webview automatically
def webviewDir = file('webview')
def skipWebviewBuild = (project.findProperty('skipWebview') ?: 'false').toString().toBoolean()

// Get custom Node.js path from local properties
def localNodePath = getLocalProperty('node.path')

tasks.register('buildWebview', Exec) {
    workingDir webviewDir

    // Determine npm command path with robust detection
    def npmCommand = 'npm'
    if (localNodePath) {
        def nodeFile = file(localNodePath)
        def npmExecutable = null
        def pathToAdd = null

        if (nodeFile.isFile()) {
            // localNodePath points to node executable (e.g., /usr/local/bin/node)
            // npm should be in the same directory
            def binDir = nodeFile.parentFile
            def npmInSameDir = new File(binDir, 'npm')
            if (npmInSameDir.exists()) {
                npmExecutable = npmInSameDir
                pathToAdd = binDir.absolutePath
            }
        } else if (nodeFile.isDirectory()) {
            // localNodePath points to a directory, check multiple possible locations
            // Case 1: bin/npm (standard installation like /usr/local/node/bin/npm)
            def npmInBin = new File(nodeFile, 'bin/npm')
            // Case 2: npm directly in directory (e.g., /usr/local/bin/npm)
            def npmInDir = new File(nodeFile, 'npm')

            if (npmInBin.exists()) {
                npmExecutable = npmInBin
                pathToAdd = new File(nodeFile, 'bin').absolutePath
            } else if (npmInDir.exists()) {
                npmExecutable = npmInDir
                pathToAdd = nodeFile.absolutePath
            }
        }

        if (npmExecutable != null) {
            npmCommand = npmExecutable.absolutePath
            println "Using npm executable: ${npmCommand}"
        }

        if (pathToAdd != null) {
            def currentPath = System.getenv('PATH') ?: ''
            environment 'PATH', "${pathToAdd}${File.pathSeparator}${currentPath}"
        }

        println "Using custom Node.js path: ${localNodePath}"
    }

    // npm runs the `prebuild` script (webview/scripts/extract-version.mjs)
    // before `build`, and that script prefers this over build.gradle's literal
    // so the version shown in the webview UI matches the release tag.
    environment 'RELEASE_VERSION', version.toString()

    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'cmd', '/c', npmCommand, 'run', 'build'
    } else {
        commandLine npmCommand, 'run', 'build'
    }

    onlyIf { webviewDir.exists() && !skipWebviewBuild }
    if (skipWebviewBuild) {
        println "Skipping webview build because -PskipWebview=true"
    }
    doFirst {
        // Install webview npm dependencies if node_modules doesn't exist
        if (!new File(webviewDir, 'node_modules').exists()) {
            println 'Installing webview npm dependencies...'
            exec {
                workingDir webviewDir
                if (System.getProperty('os.name').toLowerCase().contains('windows')) {
                    commandLine 'cmd', '/c', npmCommand, 'ci'
                } else {
                    commandLine npmCommand, 'ci'
                }
            }
            println 'Webview npm dependencies installed.'
        }
        println "Building webview..."
    }
    doLast { println "Webview build completed." }
}

// Ensure processResources runs after buildWebview
// Use mustRunAfter for execution order, trigger buildWebview before compileJava
tasks.named('compileJava') {
    dependsOn('buildWebview')
}

tasks.named('processResources') {
    mustRunAfter('buildWebview')
}

// opencode-buddy-core bridge version strategy:
//   - development: use the sibling checkout (../opencode-buddy-core) when present;
//   - CI / clean checkouts: resolve the *latest* GitHub release via the API on each
//     build, TTL-cached so rapid rebuilds and offline builds stay cheap.
// The previous hand-pinned constant silently shipped a stale bridge whose
// cli-path.js did not understand OPENCODEBUDDY_CLI_PATH, so the user's configured
// opencode path was ignored and the engine was auto-scanned instead.
def coreVersionDefault = '0.2.0'
def coreRepoSlug = 'SenjuObito/opencode-buddy-core'
def coreCacheDir = layout.buildDirectory.dir('core-cache').get().asFile
def coreVersionFile = new File(coreCacheDir, 'resolved-core-version.txt')
def coreVersionTtlMs = 60L * 60L * 1000L

// Sibling repository detection for opencode-buddy-core (development override)
def siblingCoreDir = new File(projectDir.parentFile, 'opencode-buddy-core')

def coreVersionOf = { -> coreVersionFile.exists() ? coreVersionFile.text.trim() : coreVersionDefault }
def cachedCoreZipOf = { String v -> new File(coreCacheDir, "ai-bridge-${v}.zip") }
def cachedCoreHashOf = { String v -> new File(coreCacheDir, "ai-bridge-${v}.hash") }

// Query the latest release tag (without the leading "v"), or null on any failure.
def resolveLatestCoreVersion = {
    String token = System.getenv('GITHUB_TOKEN') ?: System.getenv('GH_TOKEN')
    try {
        def conn = (java.net.HttpURLConnection) new URI(
                "https://api.github.com/repos/${coreRepoSlug}/releases/latest").toURL().openConnection()
        conn.setRequestProperty('Accept', 'application/vnd.github+json')
        conn.setRequestProperty('User-Agent', 'opencode-buddy-jetbrains-build')
        if (token) {
            conn.setRequestProperty('Authorization', "Bearer ${token}")
        }
        conn.setConnectTimeout(15000)
        conn.setReadTimeout(20000)
        int status = conn.getResponseCode()
        if (status != 200) {
            println "WARN: GitHub releases API returned HTTP ${status}; falling back to cached/default version"
            conn.disconnect()
            return null
        }
        String body = conn.inputStream.getText('UTF-8')
        conn.disconnect()
        def matcher = body =~ /"tag_name"\s*:\s*"v?([^"]+)"/
        return matcher.find() ? matcher.group(1) : null
    } catch (Exception e) {
        println "WARN: Could not resolve latest opencode-buddy-core version: ${e.message}"
        return null
    }
}

// Read the cached core version, refreshing it from GitHub when the TTL has lapsed
// (or when -PrefreshCoreVersion=true is passed).
def resolveCoreVersion = { boolean force ->
    coreCacheDir.mkdirs()
    boolean fresh = coreVersionFile.exists()
            && (System.currentTimeMillis() - coreVersionFile.lastModified()) < coreVersionTtlMs
    if (!force && fresh) {
        return coreVersionFile.text.trim()
    }
    String resolved = resolveLatestCoreVersion()
    if (!resolved) {
        resolved = coreVersionFile.exists() ? coreVersionFile.text.trim() : coreVersionDefault
        println "WARN: Using fallback opencode-buddy-core version v${resolved}"
    } else {
        println "Resolved latest opencode-buddy-core release: v${resolved}"
    }
    coreVersionFile.text = resolved
    return resolved
}

// Download or package opencode-buddy-core distribution zip automatically
tasks.register('downloadAiBridgeCore') {
    // If sibling repo exists, register its source files as task inputs so changes trigger rebuild
    if (siblingCoreDir.exists() && siblingCoreDir.isDirectory()) {
        inputs.files(fileTree(siblingCoreDir) {
            include 'daemon.js', 'channel-manager.js', 'package.json', 'scripts/**', 'services/**', 'channels/**', 'utils/**'
            exclude '**/node_modules/**', '**/dist/**', '**/.git/**'
        })
    }

    doLast {
        boolean forceVersion = (project.findProperty('refreshCoreVersion') ?: 'false').toString().toBoolean()
        String coreVersion = resolveCoreVersion(forceVersion)
        File cachedCoreZip = cachedCoreZipOf(coreVersion)
        File cachedCoreHash = cachedCoreHashOf(coreVersion)
        String coreZipReleaseUrl = "https://github.com/${coreRepoSlug}/releases/download/v${coreVersion}/ai-bridge.zip"
        String coreHashReleaseUrl = "https://github.com/${coreRepoSlug}/releases/download/v${coreVersion}/ai-bridge.hash"

        // Priority 1: User explicitly specified bridge zip via env var or system property
        String customZipPath = System.getenv("OPENCODE_DEV_BRIDGE_ZIP") ?: System.getProperty("opencode.bridge.zip")
        if (customZipPath) {
            File customZip = file(customZipPath)
            if (customZip.exists()) {
                println "Using local custom bridge zip: ${customZip.absolutePath}"
                coreCacheDir.mkdirs()
                java.nio.file.Files.copy(customZip.toPath(), cachedCoreZip.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                return
            }
        }

        // Priority 2: Local sibling opencode-buddy-core repository
        if (siblingCoreDir.exists() && siblingCoreDir.isDirectory()) {
            File coreDistZip = new File(siblingCoreDir, 'dist/ai-bridge.zip')
            File coreDistHash = new File(siblingCoreDir, 'dist/ai-bridge.hash')
            File packScript = new File(siblingCoreDir, 'scripts/pack-zip.mjs')

            boolean needPack = !coreDistZip.exists() || (project.findProperty('repackCore') ?: 'false').toString().toBoolean()
            if (!needPack && coreDistZip.exists()) {
                def keyFiles = [new File(siblingCoreDir, 'daemon.js'), new File(siblingCoreDir, 'package.json'), packScript]
                needPack = keyFiles.any { it.exists() && it.lastModified() > coreDistZip.lastModified() }
            }

            if (needPack && packScript.exists()) {
                println "Building opencode-buddy-core zip from local sibling directory (${siblingCoreDir.absolutePath})..."
                exec {
                    workingDir siblingCoreDir
                    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
                        commandLine 'cmd', '/c', 'npm', 'run', 'pack:zip'
                    } else {
                        commandLine 'npm', 'run', 'pack:zip'
                    }
                }
            }

            if (coreDistZip.exists() && coreDistZip.length() > 0) {
                println "✓ Using local opencode-buddy-core build: ${coreDistZip.absolutePath}"
                coreCacheDir.mkdirs()
                java.nio.file.Files.copy(coreDistZip.toPath(), cachedCoreZip.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                if (coreDistHash.exists()) {
                    java.nio.file.Files.copy(coreDistHash.toPath(), cachedCoreHash.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                }
                return
            }
        }

        // Priority 3: Cached zip from previous run
        if (cachedCoreZip.exists() && cachedCoreZip.length() > 0) {
            println "Using cached opencode-buddy-core zip: ${cachedCoreZip.absolutePath}"
            return
        }

        // Priority 4: Download from GitHub Release fallback
        println "Downloading opencode-buddy-core v${coreVersion} asset from ${coreZipReleaseUrl}..."
        coreCacheDir.mkdirs()

        def downloadWithRedirects = { String urlStr, File targetFile ->
            String currentUrl = urlStr
            for (int redirects = 0; redirects < 10; redirects++) {
                def conn = (java.net.HttpURLConnection) new URI(currentUrl).toURL().openConnection()
                conn.setInstanceFollowRedirects(true)
                conn.setConnectTimeout(20000)
                conn.setReadTimeout(60000)
                int status = conn.getResponseCode()
                if (status == java.net.HttpURLConnection.HTTP_MOVED_TEMP ||
                    status == java.net.HttpURLConnection.HTTP_MOVED_PERM ||
                    status == java.net.HttpURLConnection.HTTP_SEE_OTHER ||
                    status == 307 || status == 308) {
                    currentUrl = conn.getHeaderField("Location")
                    conn.disconnect()
                    continue
                }
                if (status >= 400) {
                    throw new GradleException("Failed to download from ${currentUrl}: HTTP ${status}")
                }
                conn.inputStream.withStream { input ->
                    targetFile.withOutputStream { output ->
                        output << input
                    }
                }
                conn.disconnect()
                return
            }
            throw new GradleException("Too many redirects downloading ${urlStr}")
        }

        downloadWithRedirects(coreZipReleaseUrl, cachedCoreZip)
        println "✓ Downloaded ai-bridge.zip (${cachedCoreZip.length() / 1024} KB)"

        try {
            downloadWithRedirects(coreHashReleaseUrl, cachedCoreHash)
            println "✓ Downloaded ai-bridge.hash"
        } catch (Exception e) {
            println "Note: Could not download ai-bridge.hash (${e.message}), will compute SHA-256 locally"
        }
    }
}

// Package ai-bridge into zip using the downloaded opencode-buddy-core release
tasks.register('packageAiBridge') {
    dependsOn('downloadAiBridgeCore')
    // Declare the core cache as an input so a refreshed/changed bridge actually
    // re-packages. Without this the task was considered UP-TO-DATE whenever its
    // outputs existed, silently shipping a stale ai-bridge.zip.
    inputs.dir(coreCacheDir)
    outputs.files(aiBridgeArchive, aiBridgeHashFile)

    doLast {
        String coreVersion = coreVersionOf()
        File cachedCoreZip = cachedCoreZipOf(coreVersion)
        File cachedCoreHash = cachedCoreHashOf(coreVersion)
        aiBridgePackDir.mkdirs()
        if (cachedCoreZip.exists() && cachedCoreZip.length() > 0) {
            java.nio.file.Files.copy(cachedCoreZip.toPath(), aiBridgeArchive.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            if (cachedCoreHash.exists() && cachedCoreHash.length() > 0) {
                java.nio.file.Files.copy(cachedCoreHash.toPath(), aiBridgeHashFile.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            } else {
                def digest = java.security.MessageDigest.getInstance('SHA-256')
                aiBridgeArchive.withInputStream { is ->
                    byte[] buffer = new byte[8192]
                    int read
                    while ((read = is.read(buffer)) != -1) {
                        digest.update(buffer, 0, read)
                    }
                }
                def hashHex = digest.digest().collect { String.format('%02x', it) }.join('')
                aiBridgeHashFile.text = hashHex
            }
            println "✓ Packaged ai-bridge.zip from opencode-buddy-core: ${aiBridgeArchive.absolutePath}"
            println "  Size: ${aiBridgeArchive.length() / 1024} KB"
            return
        }

        throw new GradleException("Packaging failed: cached opencode-buddy-core zip not found")
    }
}

// Extract plugin name
def pluginName = project.name

tasks.matching { it.name.startsWith('prepareSandbox') }.configureEach {
    dependsOn('buildWebview', 'packageAiBridge')
    // Declare ai-bridge files as task inputs so changes to JS source
    // invalidate the UP-TO-DATE check and ensure doLast (copy/cleanup) runs.
    inputs.files(aiBridgeArchive, aiBridgeHashFile)
    def sandboxRootProvider = layout.buildDirectory.dir('idea-sandbox')
    // Capture needed file references during configuration phase
    def archiveSource = aiBridgeArchive
    def hashSource = aiBridgeHashFile

    doLast {
        if (!archiveSource.exists()) {
            throw new GradleException('ai-bridge.zip does not exist. Ensure downloadAiBridgeCore and packageAiBridge succeeded.')
        }
        def sandboxRoot = sandboxRootProvider.get().asFile

        // Find all plugin directories (including versioned ones like IC-2024.3.1/plugins/)
        def pluginDirs = []

        // Direct plugins directory
        def directPluginDir = new File(sandboxRoot, "plugins/${pluginName}")
        if (directPluginDir.exists() || directPluginDir.parentFile.exists()) {
            pluginDirs.add(directPluginDir)
        }

        // Versioned plugin directories (IC-*/plugins/, PC-*/plugins/, etc.)
        sandboxRoot.listFiles()?.each { file ->
            if (file.isDirectory() && file.name.matches(/[A-Z]+-\d+\.\d+\.\d+/)) {
                def versionedPluginDir = new File(file, "plugins/${pluginName}")
                if (versionedPluginDir.exists() || versionedPluginDir.parentFile.exists()) {
                    pluginDirs.add(versionedPluginDir)
                }
            }
        }

        if (pluginDirs.isEmpty()) {
            println "Warning: No plugin directories found in sandbox"
        }

        // Copy ai-bridge.zip to all found plugin directories
        pluginDirs.each { pluginDir ->
            println "Copying ai-bridge to: ${pluginDir.absolutePath}"

            def extractedDir = new File(pluginDir, 'ai-bridge')
            def archiveTarget = new File(pluginDir, 'ai-bridge.zip')
            def hashTarget = new File(pluginDir, 'ai-bridge.hash')

            // Ensure plugin directory exists
            pluginDir.mkdirs()

            // Use ant tasks for delete and copy, avoiding project.* methods
            ant.delete(dir: extractedDir, failonerror: false)
            ant.delete(file: archiveTarget, failonerror: false)
            ant.delete(file: hashTarget, failonerror: false)
            ant.copy(file: archiveSource, todir: pluginDir)
            if (hashSource.exists()) {
                ant.copy(file: hashSource, todir: pluginDir)
            }

            println "✓ ai-bridge.zip copied to: ${archiveTarget.absolutePath}"
        }
    }
}

// Configure tasks after prepareSandbox to ensure ai-bridge.zip is included
tasks.matching { it.name == 'preparePluginForDistribution' || it.name == 'composedJar' }.configureEach {
    dependsOn('packageAiBridge')
}

tasks.named('buildPlugin') {
    dependsOn('packageAiBridge', 'checkstyleMain')
    // Invalidate UP-TO-DATE when ai-bridge.zip content changes.
    inputs.files(aiBridgeArchive, aiBridgeHashFile)

    doLast {
        // Unzip the plugin zip, add ai-bridge.zip and ai-bridge.hash, then repackage
        def distributionFile = archiveFile.get().asFile
        if (distributionFile.exists() && aiBridgeArchive.exists()) {
            def tempDir = file("${layout.buildDirectory.get()}/tmp/plugin-repack")
            delete(tempDir)

            // Unzip
            copy {
                from zipTree(distributionFile)
                into tempDir
            }

            // Find the plugin directory and add ai-bridge.zip and ai-bridge.hash
            def pluginDir = new File(tempDir, pluginName)
            if (pluginDir.exists()) {
                copy {
                    from aiBridgeArchive
                    from aiBridgeHashFile
                    into pluginDir
                }

                // Delete searchableOptions jar if present
                fileTree(new File(pluginDir, 'lib')).matching {
                    include '**/*searchableOptions*.jar'
                }.each { jarFile ->
                    delete(jarFile)
                    println "Deleted searchableOptions jar: ${jarFile.name}"
                }

                // Repackage
                delete(distributionFile)
                ant.zip(destfile: distributionFile) {
                    fileset(dir: tempDir)
                }
                println "Added ai-bridge.zip and ai-bridge.hash to plugin package and removed searchableOptions jar"
            }

            delete(tempDir)
        }
    }
}

// ---------------------------------------------------------------------------
// Architecture guard (docs/full-refactor-architecture-plan.md §16)
//
// Legacy mechanisms must stay deleted. The `forbidden` list is a hard gate: a
// hit fails the build. The `debt` list is the set of patterns the cutover has
// not removed yet; it is reported on every `check` and becomes fatal with
// -PstrictLegacy=true once the counters reach zero.
//
// Any intentional exception must sit on the same line and carry
// `legacy-allow: <reason>`, so the exception is visible where it applies.
// ---------------------------------------------------------------------------
tasks.register('checkLegacyPatterns') {
    group = 'verification'
    description = 'Fails on removed legacy mechanisms and reports remaining architecture debt.'

    def javaSources = fileTree('src/main/java') { include '**/*.java' }
    def webviewSources = fileTree('webview/src') {
        include '**/*.ts'
        include '**/*.tsx'
        exclude '**/*.test.ts'
        exclude '**/*.test.tsx'
    }

    def forbidden = [
        'legacy-session-identity': [files: javaSources.plus(webviewSources), pattern: ~/claimUnboundTab|switch_session|permissionServiceKey|__pendingSessionId|getHostedSessionIds/],
        // A bare "current session" accessor is the ambiguity the cutover
        // removes: window-level code must ask for the active tab by name.
        'active-session-fallback': [files: javaSources, pattern: ~/context\.getSession\(\)/],
        // The streaming runtime belongs to a tab; it is never copied into
        // another tab's slot.
        'single-runtime-swap':     [files: webviewSources, pattern: ~/captureStreamingRuntime|restoreStreamingRuntime/],
        // The transition guard is per tab, never a window-wide flag.
        'global-transition-lock':  [files: webviewSources, pattern: ~/__sessionTransitioning/],
        // A session map may only be keyed by a canonical session id.
        'mixed-session-map-keys':  [files: javaSources, pattern: /sessions\.put|sessionCoalescers\.keySet/],
        // The catalog's events travel as named events; calling the legacy
        // function names positionally would put the protocol back in the dark.
        // The audit normalizes a leading "window." away before matching, so the
        // compatible call spelling cannot be used to slip past this rule.
        'positional-event-calls':  [files: javaSources, pattern: /callJavaScript\("(onContentDelta|onThinkingDelta|onStreamStart|onStreamEnd|onTurnEnd|onStreamingHeartbeat|onBlockReset|onUsageUpdate|onTodoUpdated|onTaskEvent|onRevertStateUpdate|onMessagesRemoved|updateMessages|updateMessageTail|updateStatus|updateSessionTitle|showLoading|showThinkingStatus|showSummary|updateRetryStatus|patchMessageUuid|setSessionId|historyLoadComplete|clearMessages|commandRejected|showPermissionDialog|showAskUserQuestionDialog|showPlanApprovalDialog|forceClose[A-Za-z]*)"/],
    ]
    def debt = [
        // The event handlers must not route by "the session on screen": a
        // background tab's event has to reach its own tab.
        'window-session-lookup':   [files: fileTree('webview/src/hooks/windowCallbacks') {
            include '**/*.ts'
            exclude '**/*.test.ts'
        }, pattern: ~/currentSessionIdRef\.current/],
    ]
    def strict = project.hasProperty('strictLegacy') && project.property('strictLegacy').toString() == 'true'

    doLast {
        def violations = []
        def debtCounts = [:]

        forbidden.each { name, rule ->
            rule.files.each { file ->
                file.eachLine { line, number ->
                    // The bridge accepts "window.<fn>" as a compatible spelling of
                    // "<fn>". Auditing only the raw line let that spelling bypass
                    // every rule, so the check looks at the normalized call too.
                    def audited = line.replace('callJavaScript("window.', 'callJavaScript("')
                    if ((audited =~ rule.pattern).find() && !line.contains('legacy-allow:')) {
                        violations << "${name}: ${project.relativePath(file)}:${number}"
                    }
                }
            }
        }

        debt.each { name, rule ->
            int count = 0
            rule.files.each { file ->
                // An exception may sit on the line itself or on the line above
                // it (a comment that explains the exception).
                String previousLine = ''
                file.eachLine { line, number ->
                    boolean excused = line.contains('legacy-allow:') || previousLine.contains('legacy-allow:')
                    if ((line =~ rule.pattern).find() && !excused) {
                        count++
                        if (count <= 5) {
                            println "  [debt:${name}] ${project.relativePath(file)}:${number}"
                        }
                    }
                    previousLine = line
                }
            }
            debtCounts[name] = count
        }

        if (!violations.isEmpty()) {
            violations.each { println "  ✗ ${it}" }
            throw new GradleException("checkLegacyPatterns: ${violations.size()} removed legacy mechanism(s) are back; see docs/full-refactor-architecture-plan.md §2.3")
        }

        def total = debtCounts.values().sum() ?: 0
        println "checkLegacyPatterns: 0 forbidden hits, ${total} remaining debt lines ${debtCounts}"
        if (strict && total > 0) {
            throw new GradleException("checkLegacyPatterns: -PstrictLegacy=true and ${total} debt lines remain")
        }
    }
}

tasks.named('check') {
    dependsOn 'checkLegacyPatterns'
}
