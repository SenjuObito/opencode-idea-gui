<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Plugin icon (light / default theme).
       Geometry and colors mirror src/main/resources/icons/logo.png, the opencode mark
       already shipped with this plugin, so Settings | Plugins, the plugin manager and
       the Marketplace show the opencode brand instead of the legacy CC GUI logo.
       The tile is dark on purpose: it stays legible on light and dark IDE backgrounds. -->
  <rect width="512" height="512" fill="#131010"/>
  <rect x="128" y="96" width="256" height="320" fill="#FFFFFF"/>
  <rect x="192" y="160" width="128" height="192" fill="#131010"/>
  <rect x="192" y="224" width="128" height="128" fill="#5A5858"/>
</svg>
