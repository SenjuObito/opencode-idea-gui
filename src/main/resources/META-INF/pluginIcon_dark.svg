<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Plugin icon (dark theme).
       Intentionally identical to pluginIcon.svg: the opencode mark carries its own dark
       tile, so it reads well on both light and dark IDE backgrounds and needs no
       theme-specific recoloring (same approach the previous CC GUI icon used). -->
  <rect width="512" height="512" fill="#131010"/>
  <rect x="128" y="96" width="256" height="320" fill="#FFFFFF"/>
  <rect x="192" y="160" width="128" height="192" fill="#131010"/>
  <rect x="192" y="224" width="128" height="128" fill="#5A5858"/>
</svg>
