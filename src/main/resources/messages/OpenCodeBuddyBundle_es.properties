# OpencodeBuddyToolWindow
toolwindow.preparingBridge=Preparando AI Bridge...
toolwindow.jcefNotInstalled=El módulo JCEF no está instalado en el IDE actual
toolwindow.jcefNotInstalledSolution=Solución:\nPresione Shift dos veces, busque "Choose Boot Java Runtime for the IDE"\nEn el menú desplegable, seleccione una versión marcada con "JCEF" para descargar e instalar.\nEspere a que se complete la descarga, haga clic en OK y reinicie el IDE.
toolwindow.jcefDisabled=JCEF está deshabilitado en el Registro del IDE
toolwindow.jcefDisabledSolution=El entorno JCEF está disponible, pero ide.browser.jcef.enabled es false.\nHaga clic en "Habilitar JCEF" y reinicie completamente el IDE.
toolwindow.jcefEnableAction=Habilitar JCEF
toolwindow.jcefRestartRequired=JCEF habilitado: es necesario reiniciar
toolwindow.jcefRestartRequiredSolution=El Registro del IDE se actualizó correctamente.\nCierre completamente y reinicie el IDE para inicializar JCEF.
toolwindow.jcefPluginMissing=Android Studio requiere Web Browser (JCEF)
toolwindow.jcefPluginMissingSolution=Abra Settings > Plugins > Marketplace.\nInstale "Web Browser (JCEF)" de JetBrains y reinicie Android Studio.\nCambiar solo el Boot Runtime no instala este módulo del IDE.
toolwindow.jcefOutdatedJbr=El Java Runtime (JBR) incluido en el IDE es demasiado antiguo para JCEF
toolwindow.jcefOutdatedJbrSolution=Este IDE (p. ej. Android Studio 2026.x) incluye un JBR sin la API JCEF\nrequerida por la plataforma (JCefAppConfig.isRemoteEnabled).\nSolución:\nPresione Shift dos veces, busque "Choose Boot Java Runtime for the IDE"\nSeleccione o agregue un JetBrains Runtime con JCEF b1373 o más reciente.\nDescarga manual: https://cache-redirector.jetbrains.com/intellij-jbr/\n(p. ej. jbr_jcef-21.0.10-windows-x64-b1373.tar.gz)\nLuego reinicie el IDE.
toolwindow.jcefRemoteError=Error del módulo JCEF en el editor
toolwindow.jcefRemoteSolution=Error conocido de JCEF (JBR-9234) en el modo out-of-process de JCEF en IntelliJ 2025.2+.\nUse el botón siguiente para aplicar la corrección y luego reinicie completamente el IDE (debe salir completamente, no solo volver a la página de selección de proyecto).\nAlternativa manual: en Help - Edit Custom VM Options añada:\n-Dide.browser.jcef.out-of-process.enabled=false
toolwindow.jcefRemoteAction=Desactivar JCEF out-of-process
toolwindow.jcefOutOfProcessDisabled=JCEF out-of-process desactivado - reinicio requerido
toolwindow.jcefOutOfProcessDisabledSolution=El registro del IDE se ha actualizado correctamente.\nCierre completamente y reinicie el IDE para ejecutar JCEF en proceso.
toolwindow.jcefRemoteActionFailedTitle=No se pudo actualizar el registro del IDE
toolwindow.jcefRemoteActionFailed=No se pudo escribir el valor del registro automáticamente.\nAplique la corrección manualmente: en Help - Edit Custom VM Options añada:\n-Dide.browser.jcef.out-of-process.enabled=false\nLuego reinicie completamente el IDE.
toolwindow.extractingTitle=Preparando AI Bridge...
toolwindow.extractingDesc=Configuración inicial: extrayendo componentes de AI Bridge.\nEsto solo ocurre en la primera instalación/actualización (aprox. 10-30s).

