# ClaudeSDKToolWindow
toolwindow.preparingBridge=Préparation de AI Bridge...
toolwindow.jcefNotInstalled=Le module JCEF n'est pas installé dans l'IDE actuel
toolwindow.jcefNotInstalledSolution=Solution :\nAppuyez deux fois sur Shift, recherchez "Choose Boot Java Runtime for the IDE"\nDans le menu déroulant, sélectionnez une version marquée "JCEF" pour télécharger et installer.\nAttendez la fin du téléchargement, cliquez sur OK, puis redémarrez l'IDE.
toolwindow.jcefDisabled=JCEF est désactivé dans le registre de l'IDE
toolwindow.jcefDisabledSolution=Le runtime JCEF est disponible, mais ide.browser.jcef.enabled vaut false.\nCliquez sur « Activer JCEF », puis redémarrez complètement l'IDE.
toolwindow.jcefEnableAction=Activer JCEF
toolwindow.jcefRestartRequired=JCEF activé - redémarrage requis
toolwindow.jcefRestartRequiredSolution=Le registre de l'IDE a été mis à jour.\nQuittez complètement l'IDE et redémarrez-le pour initialiser JCEF.
toolwindow.jcefPluginMissing=Android Studio nécessite Web Browser (JCEF)
toolwindow.jcefPluginMissingSolution=Ouvrez Settings > Plugins > Marketplace.\nInstallez « Web Browser (JCEF) » de JetBrains, puis redémarrez Android Studio.\nChanger uniquement le Boot Runtime n'installe pas ce module IDE.
toolwindow.jcefOutdatedJbr=Le Java Runtime (JBR) fourni avec l'IDE est trop ancien pour JCEF
toolwindow.jcefOutdatedJbrSolution=Cet IDE (p. ex. Android Studio 2026.x) inclut un JBR dépourvu de l'API JCEF\nrequise par la plateforme (JCefAppConfig.isRemoteEnabled).\nSolution :\nAppuyez deux fois sur Shift, recherchez "Choose Boot Java Runtime for the IDE"\nSélectionnez ou ajoutez un JetBrains Runtime avec JCEF b1373 ou plus récent.\nTéléchargement manuel : https://cache-redirector.jetbrains.com/intellij-jbr/\n(p. ex. jbr_jcef-21.0.10-windows-x64-b1373.tar.gz)\nPuis redémarrez l'IDE.
toolwindow.jcefRemoteError=Erreur du module JCEF dans l'éditeur
toolwindow.jcefRemoteSolution=Bogue JCEF connu (JBR-9234) dans le mode out-of-process de JCEF sur IntelliJ 2025.2+.\nCliquez sur le bouton ci-dessous pour appliquer le correctif, puis redémarrez complètement l'IDE (vous devez quitter complètement, pas seulement revenir à la page de sélection du projet).\nAlternative manuelle : dans Help - Edit Custom VM Options ajoutez :\n-Dide.browser.jcef.out-of-process.enabled=false
toolwindow.jcefRemoteAction=Désactiver JCEF out-of-process
toolwindow.jcefOutOfProcessDisabled=JCEF out-of-process désactivé - redémarrage requis
toolwindow.jcefOutOfProcessDisabledSolution=Le registre de l'IDE a été mis à jour avec succès.\nQuittez complètement et redémarrez l'IDE pour exécuter JCEF dans le processus.
toolwindow.jcefRemoteActionFailedTitle=Impossible de mettre à jour le registre de l'IDE
toolwindow.jcefRemoteActionFailed=La valeur du registre n'a pas pu être écrite automatiquement.\nAppliquez le correctif manuellement : dans Help - Edit Custom VM Options ajoutez :\n-Dide.browser.jcef.out-of-process.enabled=false\nPuis redémarrez complètement l'IDE.
toolwindow.extractingTitle=Préparation de AI Bridge...
toolwindow.extractingDesc=Configuration initiale : extraction des composants AI Bridge.\nCela ne se produit qu'à la première installation/mise à jour (environ 10-30s).

