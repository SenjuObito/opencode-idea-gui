# OpencodeBuddyToolWindow
toolwindow.preparingBridge=AI Bridge तैयार हो रहा है...
toolwindow.jcefNotInstalled=वर्तमान IDE में JCEF मॉड्यूल स्थापित नहीं है
toolwindow.jcefNotInstalledSolution=समाधान:\nShift दो बार दबाएं, "Choose Boot Java Runtime for the IDE" खोजें\nड्रॉपडाउन में "JCEF" चिह्नित संस्करण चुनें और डाउनलोड करें।\nडाउनलोड पूर्ण होने की प्रतीक्षा करें, OK क्लिक करें, फिर IDE पुनर्प्रारंभ करें।
toolwindow.jcefDisabled=IDE Registry में JCEF अक्षम है
toolwindow.jcefDisabledSolution=JCEF runtime उपलब्ध है, लेकिन ide.browser.jcef.enabled false है।\n"JCEF सक्षम करें" क्लिक करें, फिर IDE को पूरी तरह पुनर्प्रारंभ करें।
toolwindow.jcefEnableAction=JCEF सक्षम करें
toolwindow.jcefRestartRequired=JCEF सक्षम है - पुनर्प्रारंभ आवश्यक
toolwindow.jcefRestartRequiredSolution=IDE Registry सफलतापूर्वक अपडेट हो गई है।\nJCEF प्रारंभ करने के लिए IDE को पूरी तरह बंद करके पुनर्प्रारंभ करें।
toolwindow.jcefPluginMissing=Android Studio में Web Browser (JCEF) आवश्यक है
toolwindow.jcefPluginMissingSolution=Settings > Plugins > Marketplace खोलें।\nJetBrains का "Web Browser (JCEF)" स्थापित करें, फिर Android Studio पुनर्प्रारंभ करें।\nकेवल Boot Runtime बदलने से यह IDE मॉड्यूल स्थापित नहीं होता।
toolwindow.jcefOutdatedJbr=IDE के साथ आया Java Runtime (JBR) JCEF के लिए बहुत पुराना है
toolwindow.jcefOutdatedJbrSolution=यह IDE (जैसे Android Studio 2026.x) ऐसा JBR शामिल करता है जिसमें प्लेटफ़ॉर्म के लिए\nआवश्यक JCEF API (JCefAppConfig.isRemoteEnabled) नहीं है।\nसमाधान:\nShift दो बार दबाएं, "Choose Boot Java Runtime for the IDE" खोजें\nJCEF b1373 या नया JetBrains Runtime चुनें या जोड़ें।\nमैनुअल डाउनलोड: https://cache-redirector.jetbrains.com/intellij-jbr/\n(जैसे jbr_jcef-21.0.10-windows-x64-b1373.tar.gz)\nफिर IDE पुनर्प्रारंभ करें।
toolwindow.jcefRemoteError=संपादक में JCEF मॉड्यूल त्रुटि
toolwindow.jcefRemoteSolution=यह IntelliJ 2025.2+ पर out-of-process JCEF मोड में एक ज्ञात JCEF बग (JBR-9234) है।\nसुधार लागू करने के लिए नीचे दिए गए बटन पर क्लिक करें, फिर IDE को पूरी तरह पुनर्प्रारंभ करें (आपको पूरी तरह बाहर निकलना होगा, केवल प्रोजेक्ट चयन पृष्ठ पर वापस जाना पर्याप्त नहीं है)।\nमैन्युअल विकल्प: Help - Edit Custom VM Options में जोड़ें:\n-Dide.browser.jcef.out-of-process.enabled=false
toolwindow.jcefRemoteAction=out-of-process JCEF अक्षम करें
toolwindow.jcefOutOfProcessDisabled=out-of-process JCEF अक्षम किया गया - पुनर्प्रारंभ आवश्यक
toolwindow.jcefOutOfProcessDisabledSolution=IDE Registry सफलतापूर्वक अपडेट हो गई है।\nJCEF को इन-प्रोसेस में चलाने के लिए IDE को पूरी तरह बंद करके पुनर्प्रारंभ करें।
toolwindow.jcefRemoteActionFailedTitle=IDE Registry अपडेट नहीं हो सकी
toolwindow.jcefRemoteActionFailed=Registry मान स्वचालित रूप से नहीं लिखा जा सका।\nमैन्युअल रूप से सुधार लागू करें: Help - Edit Custom VM Options में जोड़ें:\n-Dide.browser.jcef.out-of-process.enabled=false\nफिर IDE को पूरी तरह पुनर्प्रारंभ करें।
toolwindow.extractingTitle=AI Bridge तैयार हो रहा है...
toolwindow.extractingDesc=प्रथम सेटअप: AI Bridge घटकों को निकाला जा रहा है।\nयह केवल प्रथम इंस्टॉल/अपडेट पर होता है (लगभग 10-30 सेकंड)।

