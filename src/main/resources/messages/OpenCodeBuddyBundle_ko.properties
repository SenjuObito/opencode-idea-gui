toolwindow.jcefNotInstalled=현재 IDE에 JCEF 모듈이 설치되어 있지 않습니다
toolwindow.jcefNotInstalledSolution=해결 방법:\nShift를 두 번 클릭하고 "Choose Boot Java Runtime for the IDE" 검색\n드롭다운에서 "JCEF" 표시가 있는 버전을 선택하여 다운로드 및 설치\n다운로드 완료 후 OK 클릭 후 IDE 재시작
toolwindow.jcefDisabled=IDE 레지스트리에서 JCEF가 비활성화되었습니다
toolwindow.jcefDisabledSolution=JCEF 런타임은 사용할 수 있지만 ide.browser.jcef.enabled가 false입니다.\n"Enable JCEF" 클릭 후 IDE를 완전히 재시작하세요.
toolwindow.jcefEnableAction=JCEF 활성화
toolwindow.jcefRestartRequired=JCEF 활성화됨 - 재시작 필요
toolwindow.jcefRestartRequiredSolution=IDE 레지스트리가 업데이트되었습니다.\nJCEF를 초기화하려면 IDE를 완전히 종료하고 재시작하세요.
toolwindow.jcefPluginMissing=Android Studio에는 웹 브라우저(JCEF)가 필요합니다
toolwindow.jcefPluginMissingSolution=설정 > 플러그인 > 마켓플레이스 열기\nJetBrains의 "웹 브라우저(JCEF)" 설치 후 Android Studio 재시작\n부트 런타임 변경만으로는 이 IDE 모듈이 설치되지 않습니다
toolwindow.jcefOutdatedJbr=IDE에 포함된 Java 런타임(JBR)이 JCEF에 너무 오래되었습니다
toolwindow.jcefOutdatedJbrSolution=이 IDE(예: Android Studio 2026.x)에 포함된 JBR에는 플랫폼에 필요한 JCEF API(JCefAppConfig.isRemoteEnabled)가 없습니다.\n해결 방법:\nShift를 두 번 클릭하고 "Choose Boot Java Runtime for the IDE" 검색\nJCEF b1373 이상의 JetBrains 런타임 선택 또는 추가\n수동 다운로드: https://cache-redirector.jetbrains.com/intellij-jbr/\n(예: jbr_jcef-21.0.10-windows-x64-b1373.tar.gz)\n그 후 IDE 재시작
toolwindow.jcefRemoteError=편집기에서 JCEF 모듈 오류가 발생했습니다
toolwindow.jcefRemoteSolution=IntelliJ 2025.2 이상의 out-of-process JCEF 모드에서 알려진 JCEF 버그(JBR-9234)입니다.\n아래 버튼을 클릭하여 수정 적용 후 IDE를 완전히 재시작하세요(프로젝트 선택 페이지로 돌아가는 것만으로는 안 되고 완전히 종료해야 함).\n수동 대안: 도움말 - 사용자 지정 VM 옵션 편집에 추가:\n-Dide.browser.jcef.out-of-process.enabled=false
toolwindow.jcefRemoteAction=out-of-process JCEF 비활성화
toolwindow.jcefOutOfProcessDisabled=out-of-process JCEF 비활성화됨 - 재시작 필요
toolwindow.jcefOutOfProcessDisabledSolution=IDE 레지스트리가 정상적으로 업데이트되었습니다.\nIDE를 완전히 종료하고 재시작하면 JCEF가 인프로세스로 실행됩니다.
toolwindow.jcefRemoteActionFailedTitle=IDE 레지스트리를 업데이트할 수 없습니다
toolwindow.jcefRemoteActionFailed=레지스트리 값을 자동으로 쓸 수 없습니다.\n수동으로 수정 적용: 도움말 - 사용자 지정 VM 옵션 편집에 추가:\n-Dide.browser.jcef.out-of-process.enabled=false\n그런 다음 IDE를 완전히 재시작하세요.
