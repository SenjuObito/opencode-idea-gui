# OpencodeBuddyToolWindow
toolwindow.preparingBridge=Preparando AI Bridge...
toolwindow.jcefNotInstalled=Módulo JCEF não instalado no IDE atual
toolwindow.jcefNotInstalledSolution=Solução:\nClique duas vezes em Shift, procure por "Choose Boot Java Runtime for the IDE"\nNo dropdown, selecione uma versão marcada com "JCEF" para baixar e instalar.\nAguarde o download terminar, clique em OK, então reinicie o IDE.
toolwindow.jcefDisabled=JCEF está desativado no Registro do IDE
toolwindow.jcefDisabledSolution=O runtime JCEF está disponível, mas ide.browser.jcef.enabled é falso.\nClique em "Enable JCEF", então reinicie completamente o IDE.
toolwindow.jcefEnableAction=Ativar JCEF
toolwindow.jcefRestartRequired=JCEF ativado - reinicialização necessária
toolwindow.jcefRestartRequiredSolution=O Registro do IDE foi atualizado com sucesso.\nSaia completamente e reinicie o IDE para inicializar o JCEF.
toolwindow.jcefPluginMissing=Web Browser (JCEF) é necessário no Android Studio
toolwindow.jcefPluginMissingSolution=Abra Configurações > Plugins > Marketplace.\nInstale "Web Browser (JCEF)" da JetBrains, então reinicie o Android Studio.\nAlterar apenas o Boot Runtime não instala este módulo do IDE.
toolwindow.jcefOutdatedJbr=O Java Runtime (JBR) empacotado do IDE é muito antigo para o JCEF
toolwindow.jcefOutdatedJbrSolution=Este IDE (ex: Android Studio 2026.x) vem com um JBR que falta a API JCEF necessária pela plataforma (JCefAppConfig.isRemoteEnabled).\nSolução:\nClique duas vezes em Shift, procure por "Choose Boot Java Runtime for the IDE"\nSelecione ou adicione um JetBrains Runtime com JCEF b1373 ou mais recente.\nDownload manual: https://cache-redirector.jetbrains.com/intellij-jbr/\n(ex: jbr_jcef-21.0.10-windows-x64-b1373.tar.gz)\nEntão reinicie o IDE.
toolwindow.jcefRemoteError=Erro do módulo JCEF no editor
toolwindow.jcefRemoteSolution=Bug conhecido do JCEF (JBR-9234) no modo out-of-process do JCEF do IntelliJ em 2025.2+.\nUse o botão abaixo para aplicar a correção, então reinicie completamente o IDE (você deve sair totalmente, não apenas voltar para a tela de seleção de projeto).\nAlternativa manual: em Ajuda - Editar Opções de VM Personalizadas adicione:\n-Dide.browser.jcef.out-of-process.enabled=false
toolwindow.jcefRemoteAction=Desativar out-of-process JCEF
toolwindow.jcefOutOfProcessDisabled=Out-of-process JCEF desativado - reinicialização necessária
toolwindow.jcefOutOfProcessDisabledSolution=O Registro do IDE foi atualizado com sucesso.\nSaia completamente e reinicie o IDE para executar o JCEF in-process.
toolwindow.jcefRemoteActionFailedTitle=Não foi possível atualizar o Registro do IDE
toolwindow.jcefRemoteActionFailed=O valor do registro não pôde ser gravado automaticamente.\nAplique a correção manualmente: em Ajuda - Editar Opções de VM Personalizadas adicione:\n-Dide.browser.jcef.out-of-process.enabled=false\nEntão reinicie completamente o IDE.
toolwindow.extractingTitle=Preparando AI Bridge...
toolwindow.extractingDesc=Configuração inicial: extraindo componentes do AI Bridge.\nIsso acontece apenas na primeira instalação/atualização (aprox. 10-30s).

