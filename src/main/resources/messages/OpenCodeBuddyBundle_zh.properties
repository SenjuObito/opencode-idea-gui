# OpencodeBuddyToolWindow
toolwindow.preparingBridge=正在准备 AI Bridge...
toolwindow.jcefNotInstalled=当前 IDE 未安装 JCEF 模块
toolwindow.jcefNotInstalledSolution=解决方案:\n双击 Shift，搜索 "Choose Boot Java Runtime for the IDE"\n在下拉列表中选择标记有 "JCEF" 的版本进行下载安装。\n等待下载完成，点击确定，然后重启 IDE。
toolwindow.jcefDisabled=IDE Registry 已禁用 JCEF
toolwindow.jcefDisabledSolution=JCEF 运行时已经可用，但 ide.browser.jcef.enabled 为 false。\n点击“启用 JCEF”，然后完全退出并重启 IDE。
toolwindow.jcefEnableAction=启用 JCEF
toolwindow.jcefRestartRequired=JCEF 已启用，需要重启
toolwindow.jcefRestartRequiredSolution=IDE Registry 已成功更新。\n请完全退出并重启 IDE，以初始化 JCEF。
toolwindow.jcefPluginMissing=Android Studio 需要 Web Browser (JCEF)
toolwindow.jcefPluginMissingSolution=打开 Settings > Plugins > Marketplace。\n安装 JetBrains 发布的“Web Browser (JCEF)”，然后重启 Android Studio。\n仅更换 Boot Runtime 不会安装该 IDE 模块。
toolwindow.jcefOutdatedJbr=IDE 自带的 Java 运行时（JBR）过旧，无法启动 JCEF
toolwindow.jcefOutdatedJbrSolution=当前 IDE（如 Android Studio 2026.x）自带的 JBR 缺少平台所需的 JCEF API\n（JCefAppConfig.isRemoteEnabled）。\n解决方案:\n双击 Shift，搜索 "Choose Boot Java Runtime for the IDE"\n选择或添加 JCEF b1373 及更新版本的 JetBrains Runtime。\n手动下载: https://cache-redirector.jetbrains.com/intellij-jbr/\n（例如 jbr_jcef-21.0.10-windows-x64-b1373.tar.gz）\n完成后重启 IDE。
toolwindow.jcefRemoteError=编辑器中 JCEF 模块出错
toolwindow.jcefRemoteSolution=这是 IntelliJ 2025.2+ 的 out-of-process JCEF 模式中已知的 JCEF 缺陷 (JBR-9234)。\n点击下方按钮应用修复，然后完全重启 IDE（必须完全退出，不能只是返回到项目选择页面）。\n手动替代方案：在 Help - Edit Custom VM Options 中添加：\n-Dide.browser.jcef.out-of-process.enabled=false
toolwindow.jcefRemoteAction=禁用 out-of-process JCEF
toolwindow.jcefOutOfProcessDisabled=已禁用 out-of-process JCEF，需要重启
toolwindow.jcefOutOfProcessDisabledSolution=IDE Registry 已成功更新。\n请完全退出并重启 IDE，使 JCEF 以进程内模式运行。
toolwindow.jcefRemoteActionFailedTitle=无法更新 IDE Registry
toolwindow.jcefRemoteActionFailed=无法自动写入 Registry 值。\n请手动应用修复：在 Help - Edit Custom VM Options 中添加：\n-Dide.browser.jcef.out-of-process.enabled=false\n然后完全重启 IDE。
toolwindow.extractingTitle=正在准备 AI Bridge...
toolwindow.extractingDesc=首次设置：正在提取 AI Bridge 组件。\n此过程仅在首次安装/更新时发生（约 10-30 秒）。

