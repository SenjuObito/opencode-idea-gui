<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP: 'unsafe-inline' is required for script-src because Java/JCEF injects JS at runtime
         (sendToJava bridge, clipboard handler, font/language/theme config, console forwarding).
         style-src 'unsafe-inline' is needed for dynamically applied CSS variables and theme styles.
         TODO: Migrate to nonce-based CSP for stronger XSS protection. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data: https://cc-gui-font.local; connect-src 'self'; frame-src 'none';" />
    <title>Claude Chat Webview</title>
    <!-- Set theme data-theme attribute immediately before React loads -->
    <style>
      html, body {
        background-color: #121317 !important;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #app {
        width: 100%;
        height: 100%;
        background-color: #121317;
      }
      /*
       * Boot splash: the first painted frame, shown while the ~9.7 MB single
       * file bundle parses and React commits. It lives inside #app, so React's
       * initial mount discards it without any extra JavaScript. Colors are
       * tuned for the dark first-byte background forced above; the mark only
       * breathes (no spin/glare) to keep the startup calm.
       */
      #boot-splash {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background-color: #121317;
        color: #c8ccd6;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
          'Microsoft YaHei UI', 'Microsoft YaHei', 'PingFang SC',
          'Noto Sans CJK SC', 'Noto Sans SC', system-ui, sans-serif;
        font-size: 12px;
        letter-spacing: 0.14em;
        pointer-events: none;
        animation: boot-splash-fade-in 260ms ease-out both;
      }
      #boot-splash-mark {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
        animation: boot-splash-breathe 1600ms ease-in-out infinite;
      }
      @keyframes boot-splash-fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes boot-splash-breathe {
        0%, 100% { opacity: 0.55; transform: scale(0.94); }
        50% { opacity: 1; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash,
        #boot-splash-mark {
          animation: none;
        }
        #boot-splash-mark {
          opacity: 0.8;
        }
      }
    </style>
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme');
          var ideTheme = window.__INITIAL_IDE_THEME__;
          var theme;

          if (savedTheme === 'light' || savedTheme === 'dark') {
            // User's explicit theme selection takes priority
            theme = savedTheme;
          } else if (ideTheme === 'light' || ideTheme === 'dark') {
            // Follow IDE mode, using the theme injected by Java
            theme = ideTheme;
          } else {
            // Fallback (should not happen in theory, as Java always injects the theme)
            theme = 'dark';
          }

          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <div id="boot-splash" aria-hidden="true">
        <div id="boot-splash-mark"></div>
        <div>OpenCode</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
